# **`overrides` lives HERE, not in `package.json`.** pnpm 11 no longer reads `pnpm.overrides` from
# the manifest and only warns, so a block written there is silently ignored while the install looks
# correct.
#
# Both siblings carry changes this emitter consumes that are not published yet, so both are
# redirected to their checkouts and developed together. The release workflow refuses to publish
# while either override is here, and they come out in the release commit.
overrides:
  typespec-http-zod: "link:../typespec-http-zod"
  typespec-hono: "link:../typespec-hono"

minimumReleaseAgeExclude:
  - typespec-http-zod@0.24.0 || 0.25.0 || 0.26.0
  - zod@4.5.2
  - typespec-hono@0.21.0 || 0.22.0 || 0.23.0
  - "@typespec/asset-emitter@0.79.3"
  - "@typespec/compiler@1.17.0"
  - "@typespec/events@0.87.0"
  - "@typespec/http-specs@0.1.0-alpha.44"
  - "@typespec/http@1.17.0"
  - "@typespec/openapi3@1.17.0"
  - "@typespec/openapi@1.17.0"
  - "@typespec/rest@0.87.0"
  - "@typespec/spector@0.1.0-alpha.30"
  - "@typespec/sse@0.87.0"
  - "@typespec/streams@0.87.0"
  - "@typespec/versioning@0.87.0"
  - "@typespec/xml@0.87.0"

# `wrangler` bundles with esbuild and serves with workerd, and both need their install scripts to
# run. Named one at a time rather than allowed as a class: pnpm blocks build scripts by default, and
# the two that run here should be two somebody chose.
#
# **The key is `allowBuilds`, not `onlyBuiltDependencies`.** pnpm 11 renamed it, and the old key is
# accepted in the file and silently does nothing -- `pnpm install` keeps exiting 1 with
# ERR_PNPM_IGNORED_BUILDS while the config looks right. The same trap as `overrides` above.
allowBuilds:
  esbuild: true
  workerd: true
