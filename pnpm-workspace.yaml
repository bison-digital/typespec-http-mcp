# **`overrides` lives HERE, not in `package.json`.** pnpm 11 no longer reads
# `pnpm.overrides` from the manifest and only warns, so a block written there is silently
# ignored while the install looks correct.
#
# `typespec-http-zod@0.25.0` is not published yet. This redirects it to the sibling checkout so
# the two can be developed together, and `.github/workflows/release.yml` REFUSES to publish while
# this block is present -- `--frozen-lockfile` exits 0 on a dangling link, so a release checkout
# with no sibling on disk would install happily and fail four steps later as a wall of TS2307.
overrides:
  typespec-http-zod: "link:../typespec-http-zod"

minimumReleaseAgeExclude:
  - typespec-http-zod@0.24.0
  - zod@4.5.2
  - typespec-hono@0.21.0

# `wrangler` bundles with esbuild and serves with workerd, and both need their install scripts to
# run. Named one at a time rather than allowed as a class: pnpm blocks build scripts by default, and
# the two that run here should be two somebody chose.
#
# **The key is `allowBuilds`, not `onlyBuiltDependencies`.** pnpm 11 renamed it, and the old key is
# accepted in the file and silently does nothing -- `pnpm install` keeps exiting 1 with
# ERR_PNPM_IGNORED_BUILDS while the config looks right. The same trap as `overrides` above.
allowBuilds:
  esbuild: true
  workerd: true
